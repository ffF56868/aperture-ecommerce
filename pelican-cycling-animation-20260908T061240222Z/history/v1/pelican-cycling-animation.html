<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鹈鹕骑行 · SVG 2D 动画</title>
<style>
/* SECTION: reset & tokens */
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --ui-bg:#0b1020;
  --ui-panel:rgba(255,255,255,.07);
  --ui-line:rgba(255,255,255,.16);
  --ui-text:#eef2f8;
  --ui-dim:#9fb0c8;
  --ui-accent:#ff7a59;
  --ui-radius:18px;
  font-size:16px;
}
html,body{height:100%}
body{
  background:var(--ui-bg);
  color:var(--ui-text);
  font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,-apple-system,"Segoe UI",sans-serif;
  display:flex;flex-direction:column;
  min-height:100vh;
  overflow-x:hidden;
}

/* SECTION: scene theme variables */
body[data-theme="day"]{
  --sky1:#8ecdf5;--sky2:#dff2ff;--sun:#ffe08a;--sun-glow:rgba(255,224,138,.55);
  --cloud:#ffffff;--hill-far:#a7d3b6;--hill-near:#7fb894;--tree:#4f8a68;--tree-dark:#3d6f54;
  --ground:#e6d9b4;--road:#5b616e;--road-edge:#f2f5fa;--dash:#ffe08a;--post:#8b93a3;
  --frame:#e0563a;--rim:#cdd6e2;--tire:#2b3040;--metal:#98a3b5;
  --feather:#f7f9fc;--feather-shade:#d8e0ea;--feather-dark:#b9c4d3;
  --beak:#ffb454;--pouch:#ffd591;--skin:#f59e5b;--eye:#22262f;
  --scarf:#3aa6b9;--scarf-2:#2b849a;
}
body[data-theme="dusk"]{
  --sky1:#3f3a6b;--sky2:#ffa36f;--sun:#fff1c9;--sun-glow:rgba(255,180,120,.55);
  --cloud:#f0c7b4;--hill-far:#6b5a86;--hill-near:#4c4166;--tree:#37304f;--tree-dark:#282340;
  --ground:#7a6552;--road:#3b3a47;--road-edge:#e5c9b2;--dash:#ffd79c;--post:#6b6277;
  --frame:#ff6b4a;--rim:#c9bcd0;--tire:#1f2030;--metal:#8d8499;
  --feather:#f3e6ea;--feather-shade:#cdb2bd;--feather-dark:#a88e9d;
  --beak:#ffa246;--pouch:#ffca7a;--skin:#ef9050;--eye:#1b1a24;
  --scarf:#5ac8c0;--scarf-2:#3ba3a0;
}
body[data-theme="night"]{
  --sky1:#050a1c;--sky2:#123057;--sun:#f3f6ff;--sun-glow:rgba(200,220,255,.35);
  --cloud:#26364f;--hill-far:#152a44;--hill-near:#0f2135;--tree:#0b1a2b;--tree-dark:#071320;
  --ground:#14202f;--road:#1b2431;--road-edge:#4d5f77;--dash:#8fa6c4;--post:#34445c;
  --frame:#ff8a5c;--rim:#7f8fa6;--tire:#0d1119;--metal:#66768d;
  --feather:#dbe6f5;--feather-shade:#a9bacf;--feather-dark:#8394ab;
  --beak:#e39a4e;--pouch:#f0bd7c;--skin:#c9834a;--eye:#0c0f16;
  --scarf:#4fb3c9;--scarf-2:#35849a;
}

/* SECTION: layout */
.topbar{
  display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;
  padding:18px clamp(16px,4vw,40px) 10px;
}
.topbar h1{font-size:clamp(1.15rem,2.6vw,1.6rem);letter-spacing:.04em}
.topbar p{color:var(--ui-dim);font-size:.85rem}
.stage{
  position:relative;flex:1;min-height:320px;
  margin:0 clamp(10px,3vw,32px);
  border-radius:var(--ui-radius);overflow:hidden;
  border:1px solid var(--ui-line);
  box-shadow:0 24px 60px rgba(0,0,0,.45);
  background:#0a0f1c;
}
.stage svg{display:block;width:100%;height:100%}
.badge{
  position:absolute;left:14px;top:12px;
  font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;
  padding:6px 11px;border-radius:999px;
  background:rgba(8,12,24,.42);border:1px solid rgba(255,255,255,.2);
  color:#fff;backdrop-filter:blur(6px);
}
.paused-hint{
  position:absolute;right:14px;top:12px;font-size:.75rem;
  padding:6px 11px;border-radius:999px;
  background:rgba(8,12,24,.5);border:1px solid rgba(255,255,255,.2);
  opacity:0;transition:opacity .2s;
}
.stage.is-paused .paused-hint{opacity:1}

.panel{
  display:flex;align-items:center;gap:clamp(12px,2.4vw,26px);flex-wrap:wrap;
  margin:14px clamp(10px,3vw,32px) 26px;padding:14px clamp(14px,2.5vw,22px);
  background:var(--ui-panel);border:1px solid var(--ui-line);border-radius:var(--ui-radius);
}
.btn{
  appearance:none;border:1px solid var(--ui-line);background:rgba(255,255,255,.08);
  color:var(--ui-text);font:inherit;font-size:.9rem;
  padding:10px 18px;border-radius:12px;cursor:pointer;min-width:104px;
  transition:transform .12s,background .2s,border-color .2s;
}
.btn:hover{background:rgba(255,255,255,.16)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--ui-accent);border-color:transparent;color:#20120c;font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.speed{display:flex;align-items:center;gap:12px;flex:1 1 240px;min-width:210px}
.speed label{font-size:.85rem;color:var(--ui-dim);white-space:nowrap}
.speed output{font-variant-numeric:tabular-nums;font-size:.85rem;min-width:44px}
input[type=range]{
  flex:1;appearance:none;height:5px;border-radius:99px;
  background:linear-gradient(90deg,var(--ui-accent) 0%,rgba(255,255,255,.2) 0%);
  cursor:pointer;
}
input[type=range]::-webkit-slider-thumb{
  appearance:none;width:18px;height:18px;border-radius:50%;
  background:#fff;border:3px solid var(--ui-accent);
}
input[type=range]::-moz-range-thumb{
  width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid var(--ui-accent);
}
.readout{display:flex;gap:clamp(14px,3vw,30px);flex-wrap:wrap}
.readout div{font-size:.8rem;color:var(--ui-dim)}
.readout b{display:block;font-size:1.12rem;color:#fff;font-variant-numeric:tabular-nums;letter-spacing:.02em}

/* SECTION: svg paint bindings (CSS 变量驱动配色，随主题切换) */
#sky-top{stop-color:var(--sky1)}
#sky-bottom{stop-color:var(--sky2)}
#sunGlow stop:first-child{stop-color:var(--sun-glow)}
#roadGrad stop:first-child{stop-color:var(--road)}
#roadGrad stop:last-child{stop-color:var(--ground)}
#pedal-near{fill:var(--frame)}
#pedal-far{fill:var(--metal)}
.lamp-glow{fill:var(--dash)}
.post-line{stroke:var(--post)}
.sun-core{fill:var(--sun)}
.sun-halo{fill:url(#sunGlow)}
.cloud{fill:var(--cloud)}
.hill-far{fill:var(--hill-far)}
.hill-near{fill:var(--hill-near)}
.ground-fill{fill:var(--ground)}
.road-fill{fill:var(--road)}
.road-edge{stroke:var(--road-edge)}
.road-dash{stroke:var(--dash)}
.tree-a{fill:var(--tree)}
.tree-b{fill:var(--tree-dark)}
.post-stroke{stroke:var(--post)}
.tire{stroke:var(--tire)}
.rim{stroke:var(--rim)}
.hub{fill:var(--metal)}
.frame-tube{stroke:var(--frame)}
.metal{stroke:var(--metal)}
.saddle{fill:var(--metal)}
.body-feather{fill:var(--feather)}
.body-shade{fill:var(--feather-shade)}
.wing-shade{fill:var(--feather-dark)}
.neck-stroke{stroke:var(--feather)}
.leg-near{stroke:var(--feather)}
.leg-far{stroke:var(--feather-shade)}
.beak{fill:var(--beak)}
.pouch{fill:var(--pouch)}
.eye{fill:var(--eye)}
.scarf{fill:var(--scarf)}
.scarf-2{fill:var(--scarf-2)}

@media (max-width:640px){
  .panel{gap:12px}
  .btn{min-width:0;flex:1 1 auto;padding:10px 14px}
  .readout{width:100%}
}
@media (prefers-reduced-motion: reduce){
  .btn{transition:none}
}
</style>
</head>
<body data-theme="day">

<header class="topbar">
  <h1>鹈鹕骑行</h1>
  <p>纯 SVG 造型 + 脚本驱动的 2D 循环动画 · 双腿随踏板实时解算关节角度</p>
</header>

<!-- SECTION: stage -->
<div class="stage" id="stage">
  <span class="badge">SVG Animation</span>
  <span class="paused-hint">已暂停</span>
  <svg id="scene" viewBox="0 0 900 520" preserveAspectRatio="xMidYMid meet" role="img"
       aria-label="一只鹈鹕骑着自行车在公路上前进的动画">
    <defs>
      <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
        <stop id="sky-top" offset="0%"/>
        <stop id="sky-bottom" offset="100%"/>
      </linearGradient>
      <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="var(--sun-glow)"/>
        <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
      </radialGradient>
      <linearGradient id="roadGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="var(--road)" stop-opacity="1"/>
        <stop offset="100%" stop-color="var(--ground)" stop-opacity=".9"/>
      </linearGradient>
    </defs>

    <!-- 天空 -->
    <rect x="0" y="0" width="900" height="520" fill="url(#skyGrad)"/>

    <!-- SECTION: sky bodies (星月/太阳) -->
    <g id="sky-bodies">
      <circle class="sun-halo" cx="716" cy="96" r="96" fill="url(#sunGlow)" opacity=".9"/>
      <circle id="lamp" class="sun-core" cx="716" cy="96" r="38"/>
      <g id="stars" opacity="0"></g>
    </g>

    <!-- SECTION: parallax bands -->
    <g id="band-clouds" class="band"></g>
    <g id="band-hill-far" class="band"></g>
    <g id="band-hill-near" class="band"></g>
    <g id="band-trees" class="band"></g>

    <!-- SECTION: ground & road -->
    <g id="ground">
      <rect class="ground-fill" x="0" y="404" width="900" height="116"/>
      <rect x="0" y="418" width="900" height="76" fill="url(#roadGrad)"/>
      <line class="road-edge" x1="0" y1="419" x2="900" y2="419" stroke-width="2" opacity=".5"/>
      <line class="road-edge" x1="0" y1="493" x2="900" y2="493" stroke-width="2" opacity=".5"/>
    </g>
    <g id="band-posts" class="band"></g>
    <g id="road-lines">
      <line id="dash" class="road-dash" x1="0" y1="456" x2="900" y2="456"
            stroke-width="7" stroke-linecap="round" stroke-dasharray="46 62"/>
    </g>
    <g id="band-grass" class="band"></g>

    <!-- SECTION: bicycle -->
    <g id="bike">
      <!-- 车轮 -->
      <g id="wheel-rear">
        <circle class="tire" cx="0" cy="0" r="58" fill="none" stroke-width="9"/>
        <circle class="rim" cx="0" cy="0" r="50" fill="none" stroke-width="3"/>
        <g id="spokes-rear"></g>
        <circle class="hub" cx="0" cy="0" r="6"/>
      </g>
      <g id="wheel-front">
        <circle class="tire" cx="0" cy="0" r="58" fill="none" stroke-width="9"/>
        <circle class="rim" cx="0" cy="0" r="50" fill="none" stroke-width="3"/>
        <g id="spokes-front"></g>
        <circle class="hub" cx="0" cy="0" r="6"/>
      </g>

      <!-- 车架 -->
      <g id="frame" fill="none" stroke-linecap="round">
        <path class="frame-tube" stroke-width="8" d="M412 356 L368 254"/>
        <path class="frame-tube" stroke-width="8" d="M372 258 L520 252"/>
        <path class="frame-tube" stroke-width="8" d="M412 356 L534 296"/>
        <path class="frame-tube" stroke-width="6" d="M368 258 L300 356"/>
        <path class="frame-tube" stroke-width="6" d="M412 356 L300 356"/>
        <path class="frame-tube" stroke-width="8" d="M520 250 L536 298"/>
        <path class="frame-tube" stroke-width="7" d="M534 296 L556 356"/>
        <!-- 车把 -->
        <path class="metal" stroke-width="6" d="M520 250 C 508 234, 516 228, 534 232 L 556 238"/>
        <!-- 链条 -->
        <path class="metal" stroke-width="3" opacity=".85" d="M398 344 L292 349 M398 368 L292 363"/>
        <circle class="metal" cx="412" cy="356" r="15" fill="none" stroke-width="4"/>
      </g>
      <!-- 座垫 -->
      <path class="saddle" d="M340 250 C 352 240, 386 240, 396 249 C 386 256, 352 257, 340 250 Z"/>

      <!-- 曲柄与脚踏 -->
      <g id="crank">
        <line id="arm-far" class="metal" stroke-width="7" stroke-linecap="round"/>
        <line id="arm-near" class="metal" stroke-width="7" stroke-linecap="round"/>
      </g>
      <rect id="pedal-far" x="0" y="0" width="26" height="7" rx="3" fill="var(--metal)"/>
      <rect id="pedal-near" x="0" y="0" width="26" height="7" rx="3" fill="var(--frame)"/>
    </g>

    <!-- SECTION: pelican -->
    <g id="pelican">
      <!-- 远侧腿 -->
      <path id="leg-far" class="leg-far" fill="none" stroke-width="13" stroke-linecap="round"/>
      <path id="foot-far" class="leg-far" stroke="var(--feather-shade)" stroke-width="7"
            stroke-linecap="round" fill="none"/>

      <!-- 尾羽 -->
      <g id="tail">
        <path class="body-shade" d="M288 232 C 250 224, 226 236, 214 256 C 244 254, 262 258, 280 264 Z"/>
        <path class="body-feather" d="M286 226 C 248 212, 222 218, 206 234 C 238 236, 258 242, 278 250 Z"/>
      </g>

      <!-- 躯干 -->
      <g id="torso">
        <path class="body-feather"
              d="M300 254 C 252 250, 236 206, 268 176 C 302 146, 360 152, 386 186
                 C 408 214, 392 250, 352 258 C 334 261, 314 259, 300 254 Z"/>
        <path class="body-shade" opacity=".55"
              d="M300 254 C 268 250, 252 228, 258 206 C 286 226, 330 240, 372 236 C 366 252, 330 261, 300 254 Z"/>
      </g>

      <!-- 颈与头 -->
      <g id="neck-head">
        <path id="neck" class="neck-stroke" fill="none" stroke-width="27" stroke-linecap="round"
              d="M366 186 C 384 138, 410 112, 448 114"/>
        <g id="head">
          <path class="body-shade" d="M436 96 C 428 86, 430 78, 438 74 C 438 82, 444 88, 452 92 Z"/>
          <ellipse class="body-feather" cx="458" cy="114" rx="25" ry="21"/>
          <path id="pouch" class="pouch" d="M477 122 C 498 170, 536 166, 562 126 L 556 121 C 530 138, 500 136, 480 124 Z"/>
          <path class="beak" d="M476 105 L 570 121 C 574 123, 574 127, 569 128 L 478 124 Z"/>
          <path class="beak" opacity=".55" d="M476 118 L 552 127 L 478 124 Z"/>
          <circle class="eye" cx="466" cy="107" r="4.4"/>
          <circle cx="467.6" cy="105.4" r="1.5" fill="#fff"/>
          <path class="body-shade" stroke="var(--feather-dark)" stroke-width="2.4"
                fill="none" stroke-linecap="round" d="M458 98 C 465 95, 472 96, 476 99"/>
        </g>
      </g>

      <!-- 围巾（飘动） -->
      <path id="scarf-tie" class="scarf-2"
            d="M356 176 C 380 168, 404 172, 414 184 C 400 196, 372 196, 356 190 Z"/>
      <path id="scarf" class="scarf" d=""/>

      <!-- 翅膀 -->
      <g id="wing">
        <path class="body-shade"
              d="M352 194 C 402 188, 456 206, 502 244 C 470 256, 416 252, 382 238 C 362 230, 350 214, 352 194 Z"/>
        <path class="wing-shade" opacity=".7" fill="none" stroke-width="2.4" stroke="var(--feather-dark)"
              d="M392 232 C 412 238, 438 242, 466 244 M378 220 C 398 228, 424 234, 452 238"/>
      </g>

      <!-- 近侧腿 -->
      <path id="leg-near" class="leg-near" fill="none" stroke-width="14" stroke-linecap="round"/>
      <path id="foot-near" class="leg-near" stroke="var(--feather)" stroke-width="7.5"
            stroke-linecap="round" fill="none"/>
    </g>

    <!-- 轮下投影 -->
    <ellipse id="shadow" cx="428" cy="418" rx="176" ry="11" fill="#000" opacity=".16"/>
  </svg>
</div>

<!-- SECTION: control panel -->
<section class="panel">
  <button class="btn primary" id="btn-play" data-primary-action="toggle-play" aria-pressed="true">暂停</button>
  <button class="btn" id="btn-theme">切换场景 · 白天</button>
  <div class="speed">
    <label for="rng-speed">骑行速度</label>
    <input type="range" id="rng-speed" min="0.15" max="3" step="0.05" value="1" aria-label="骑行速度">
    <output id="out-speed">1.00×</output>
  </div>
  <div class="readout">
    <div>里程<b id="out-dist">0.00 km</b></div>
    <div>踏频<b id="out-cad">0 rpm</b></div>
    <div>轮速<b id="out-spd">0 km/h</b></div>
  </div>
</section>

<script>
/* SECTION: helpers */
const NS = 'http://www.w3.org/2000/svg';
const svg = document.getElementById('scene');
const $ = (id) => document.getElementById(id);
function make(tag, attrs, parent){
  const node = document.createElementNS(NS, tag);
  for (const k in attrs) node.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(node);
  return node;
}
// 稳定伪随机，保证每次刷新场景布局一致
function rng(seed){ let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const TAU = Math.PI * 2;
const PERIOD = 900;

/* SECTION: scenery construction
   每条视差带内绘制 [0, PERIOD) 与 [PERIOD, 2*PERIOD) 两份相同内容，
   位移取模后平移，即可无缝循环滚动。 */
function buildScatter(groupId, count, seed, place){
  const g = $(groupId);
  const r = rng(seed);
  const xs = [];
  for (let i = 0; i < count; i++) xs.push((i + 0.18 + r() * 0.64) * (PERIOD / count));
  for (const shift of [0, PERIOD]){
    xs.forEach((x, i) => place(g, x + shift, i, r));
  }
}
function hillPath(groupId, base, amp, harmonic, seed){
  const g = $(groupId);
  const r = rng(seed);
  const ph1 = r() * TAU, ph2 = r() * TAU;
  let d = '';
  for (let copy = 0; copy < 2; copy++){
    let pts = [];
    for (let x = 0; x <= PERIOD; x += 15){
      const y = base
        - amp * (0.5 + 0.5 * Math.sin((x / PERIOD) * TAU * harmonic + ph1))
        - amp * 0.45 * (0.5 + 0.5 * Math.sin((x / PERIOD) * TAU * (harmonic * 2 + 1) + ph2));
      pts.push([x + copy * PERIOD, y]);
    }
    d += `M${pts[0][0]} 520 ` + pts.map(p => `L${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join(' ') + ` L${PERIOD * (copy + 1)} 520 Z `;
  }
  make('path', { d, class: g.dataset.cls || 'hill-far' }, g);
}
// 远山
$('band-hill-far').dataset.cls = 'hill-far';
hillPath('band-hill-far', 330, 74, 1, 7717);
$('band-hill-near').dataset.cls = 'hill-near';
hillPath('band-hill-near', 372, 44, 2, 4231);

// 云
buildScatter('band-clouds', 5, 991, (g, x, i, r) => {
  const y = 58 + r() * 108, s = 0.7 + r() * 0.8;
  const cloud = make('g', { class: 'cloud', opacity: (0.5 + r() * 0.4).toFixed(2),
    transform: `translate(${x.toFixed(0)} ${y.toFixed(0)}) scale(${s.toFixed(2)})` }, g);
  make('ellipse', { cx: 0, cy: 0, rx: 42, ry: 17 }, cloud);
  make('ellipse', { cx: 30, cy: 6, rx: 30, ry: 13 }, cloud);
  make('ellipse', { cx: -30, cy: 7, rx: 26, ry: 12 }, cloud);
});

// 树
buildScatter('band-trees', 9, 313, (g, x, i, r) => {
  const kind = r();
  const baseY = 408;
  if (kind < 0.45){
    const t = make('g', { transform: `translate(${x.toFixed(0)} ${baseY})` }, g);
    make('rect', { x: -3.5, y: -46, width: 7, height: 46, class: 'tree-b', rx: 3 }, t);
    make('path', { class: 'tree-a', d: 'M0 -104 L26 -52 L14 -52 L34 -12 L-34 -12 L-14 -52 L-26 -52 Z' }, t);
  } else if (kind < 0.78){
    const t = make('g', { transform: `translate(${x.toFixed(0)} ${baseY})` }, g);
    make('rect', { x: -4, y: -40, width: 8, height: 40, class: 'tree-b', rx: 3 }, t);
    make('circle', { cx: 0, cy: -62, r: 27, class: 'tree-a' }, t);
    make('circle', { cx: -18, cy: -48, r: 18, class: 'tree-a' }, t);
    make('circle', { cx: 19, cy: -50, r: 16, class: 'tree-a' }, t);
  } else {
    const t = make('g', { transform: `translate(${x.toFixed(0)} ${baseY})`, opacity: '.9' }, g);
    make('path', { class: 'tree-a', d: 'M0 0 C -22 -6 -32 -26 -26 -46 C -12 -38 -4 -24 0 -12 C 4 -24 12 -38 26 -46 C 32 -26 22 -6 0 0 Z' }, t);
  }
});

// 路旁灯柱
buildScatter('band-posts', 4, 555, (g, x, i, r) => {
  const p = make('g', { transform: `translate(${x.toFixed(0)} 416)` }, g);
  make('path', { class: 'post-line', fill: 'none', 'stroke-width': 6,
    'stroke-linecap': 'round', d: 'M0 0 L0 -132 C 0 -152, 14 -160, 30 -158' }, p);
  make('circle', { cx: 34, cy: -156, r: 8, stroke: 'none', class: 'lamp-glow' }, p);
});

// 前景草丛
buildScatter('band-grass', 16, 1201, (g, x, i, r) => {
  const h = 8 + r() * 12;
  make('path', {
    d: `M${x.toFixed(0)} 508 q ${(h * 0.3).toFixed(1)} ${(-h).toFixed(1)} ${(h * 0.7).toFixed(1)} ${(-h * 0.9).toFixed(1)}`,
    stroke: 'var(--tree-dark)', 'stroke-width': 2.4, fill: 'none', opacity: '.55', 'stroke-linecap': 'round'
  }, g);
});

/* SECTION: spokes */
function buildSpokes(groupId){
  const g = $(groupId);
  for (let i = 0; i < 14; i++){
    const a = (i / 14) * TAU;
    make('line', {
      x1: (Math.cos(a) * 50).toFixed(1), y1: (Math.sin(a) * 50).toFixed(1),
      x2: (-Math.cos(a) * 50).toFixed(1), y2: (-Math.sin(a) * 50).toFixed(1),
      class: 'rim', 'stroke-width': 1.6, opacity: '.75'
    }, g);
  }
}
buildSpokes('spokes-rear');
buildSpokes('spokes-front');

/* SECTION: night stars */
(function buildStars(){
  const g = $('stars'), r = rng(24681);
  for (let i = 0; i < 46; i++){
    make('circle', { cx: (r() * 900).toFixed(0), cy: (r() * 300).toFixed(0),
      r: (0.8 + r() * 1.5).toFixed(2), fill: '#fff', opacity: (0.35 + r() * 0.6).toFixed(2) }, g);
  }
})();

/* SECTION: rig geometry constants */
const HUB_R = 58;
const REAR = { x: 300, y: 356 }, FRONT = { x: 556, y: 356 }, BB = { x: 412, y: 356 };
const CRANK_R = 30;
const HIP = { x: 372, y: 248 };
const L1 = 78, L2 = 80;              // 大腿 / 小腿长度
const PX_PER_M = 108;                // 像素→米换算，用于里程读数
const BASE_SPEED = 150;              // 速度 1.0 时的像素前进速率

/* SECTION: two-bone IK —— 由髋部与脚踏位置解算膝盖 */
function solveKnee(hip, foot, bendSign){
  const dx = foot.x - hip.x, dy = foot.y - hip.y;
  let d = Math.hypot(dx, dy);
  const maxReach = L1 + L2 - 0.5;
  if (d > maxReach) d = maxReach;
  if (d < Math.abs(L1 - L2) + 0.5) d = Math.abs(L1 - L2) + 0.5;
  const base = Math.atan2(dy, dx);
  const cosA = (L1 * L1 + d * d - L2 * L2) / (2 * L1 * d);
  const a = Math.acos(Math.max(-1, Math.min(1, cosA)));
  const ang = base + bendSign * a;   // bendSign 控制膝盖朝前或朝后
  const knee = { x: hip.x + Math.cos(ang) * L1, y: hip.y + Math.sin(ang) * L1 };
  // 按实际长度回推脚点，避免肢体被拉伸
  const k2f = Math.hypot(foot.x - knee.x, foot.y - knee.y);
  const scale = k2f > 0.001 ? Math.min(1, (L2 / k2f)) : 1;
  const footAdj = { x: knee.x + (foot.x - knee.x) * scale, y: knee.y + (foot.y - knee.y) * scale };
  return { knee, foot: footAdj };
}

/* SECTION: animation state */
const state = { dist: 0, playing: true, speed: 1, last: 0 };
const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
if (reduced) state.speed = 0.45;

const elRear = $('wheel-rear'), elFront = $('wheel-front');
elRear.setAttribute('transform', `translate(${REAR.x} ${REAR.y})`);
elFront.setAttribute('transform', `translate(${FRONT.x} ${FRONT.y})`);

/* SECTION: render loop */
function render(){
  const dist = state.dist;
  const crankA = dist * 0.030;               // 曲柄角
  const wheelA = crankA * 2.3;               // 轮子角速度（相当于变速比）
  const wdeg = (wheelA * 180 / Math.PI) % 360;

  elRear.setAttribute('transform', `translate(${REAR.x} ${REAR.y}) rotate(${wdeg.toFixed(2)})`);
  elFront.setAttribute('transform', `translate(${FRONT.x} ${FRONT.y}) rotate(${wdeg.toFixed(2)})`);

  // 身体起伏：每踩一圈上下一次
  const bob = Math.sin(crankA) * 3.2;
  $('pelican').setAttribute('transform', `translate(0 ${bob.toFixed(2)})`);
  $('tail').setAttribute('transform', `rotate(${(Math.sin(crankA * 2) * 2.4).toFixed(2)} 296 240)`);
  $('wing').setAttribute('transform', `rotate(${(Math.sin(crankA) * 2.6).toFixed(2)} 354 196)`);
  $('head').setAttribute('transform',
    `translate(${(Math.sin(crankA) * 1.4).toFixed(2)} ${(-Math.sin(crankA) * 1.1).toFixed(2)}) rotate(${(Math.sin(crankA * 0.5) * 1.2).toFixed(2)} 458 114)`);
  const pouchSag = 1 + 0.06 * Math.sin(crankA * 2 + 0.8);
  $('pouch').setAttribute('transform', `translate(0 ${(2 * Math.sin(crankA * 2)).toFixed(2)}) scale(1 ${pouchSag.toFixed(3)})`);

  // 曲柄与脚踏
  const pedN = { x: BB.x + Math.cos(crankA) * CRANK_R, y: BB.y + Math.sin(crankA) * CRANK_R };
  const pedF = { x: BB.x - Math.cos(crankA) * CRANK_R, y: BB.y - Math.sin(crankA) * CRANK_R };
  $('arm-near').setAttribute('x1', BB.x); $('arm-near').setAttribute('y1', BB.y);
  $('arm-near').setAttribute('x2', pedN.x.toFixed(1)); $('arm-near').setAttribute('y2', pedN.y.toFixed(1));
  $('arm-far').setAttribute('x1', BB.x); $('arm-far').setAttribute('y1', BB.y);
  $('arm-far').setAttribute('x2', pedF.x.toFixed(1)); $('arm-far').setAttribute('y2', pedF.y.toFixed(1));
  const setPedal = (id, p) => $(id).setAttribute('transform', `translate(${(p.x - 13).toFixed(1)} ${(p.y - 3.5).toFixed(1)})`);
  setPedal('pedal-near', pedN); setPedal('pedal-far', pedF);

  // 双腿 IK（局部坐标：减去身体起伏量）
  const drawLeg = (legId, footId, pedal, opacity) => {
    const foot = { x: pedal.x, y: pedal.y - bob };
    const { knee, foot: footAdj } = solveKnee(HIP, foot, -1);   // 膝盖朝前
    $(legId).setAttribute('d', `M${HIP.x} ${HIP.y} L${knee.x.toFixed(1)} ${knee.y.toFixed(1)} L${footAdj.x.toFixed(1)} ${footAdj.y.toFixed(1)}`);
    const dir = Math.cos(crankA) >= 0 ? 1 : -1;
    $(footId).setAttribute('d',
      `M${footAdj.x - 4} ${footAdj.y + 3} l ${(16 * dir).toFixed(1)} 1 m ${(-11 * dir).toFixed(1)} -1 l ${(9 * dir).toFixed(1)} 3 m ${(-8 * dir).toFixed(1)} -4 l ${(4 * dir).toFixed(1)} 5`);
    $(footId).setAttribute('opacity', opacity);
  };
  drawLeg('leg-far', 'foot-far', pedF, '0.8');
  drawLeg('leg-near', 'foot-near', pedN, '1');

  // 围巾飘带
  const scarfPts = [];
  const anchor = { x: 360, y: 186 };
  for (let i = 0; i <= 10; i++){
    const t = i / 10;
    const x = anchor.x - t * 150;
    const y = anchor.y - 8 * Math.sin(t * 3) + t * 14
      + Math.sin(crankA * 2.2 + t * 5.2) * (2 + t * 12);
    scarfPts.push([x, y]);
  }
  let sd = `M${scarfPts[0][0].toFixed(1)} ${(scarfPts[0][1] - 7).toFixed(1)}`;
  for (let i = 1; i < scarfPts.length; i++){
    const [x, y] = scarfPts[i], [px, py] = scarfPts[i - 1];
    sd += ` Q${px.toFixed(1)} ${(py - 7).toFixed(1)} ${((px + x) / 2).toFixed(1)} ${((py + y) / 2 - 6).toFixed(1)}`;
  }
  for (let i = scarfPts.length - 1; i >= 0; i--){
    const [x, y] = scarfPts[i], nx = scarfPts[Math.max(0, i - 1)];
    sd += ` L${x.toFixed(1)} ${(y + 8 + i * 0.4).toFixed(1)}`;
  }
  sd += ' Z';
  $('scarf').setAttribute('d', sd);

  // 视差滚动
  const bands = [
    ['band-clouds', 0.08], ['band-hill-far', 0.16], ['band-hill-near', 0.30],
    ['band-trees', 0.62], ['band-posts', 0.86], ['band-grass', 1.18]
  ];
  for (const [id, k] of bands){
    const off = (dist * k) % PERIOD;
    $(id).setAttribute('transform', `translate(${(-off).toFixed(2)} 0)`);
  }
  $('dash').setAttribute('stroke-dashoffset', (-(dist % 108) * 1.0).toFixed(2));
}

function frame(ts){
  if (!state.last) state.last = ts;
  const dt = Math.min(0.05, (ts - state.last) / 1000);
  state.last = ts;
  if (state.playing){
    state.dist += BASE_SPEED * state.speed * dt;
    render();
    updateReadout();
  }
  requestAnimationFrame(frame);
}

/* SECTION: readout */
function updateReadout(){
  const meters = state.dist / PX_PER_M;
  $('out-dist').textContent = (meters / 1000).toFixed(2) + ' km';
  const vpx = BASE_SPEED * state.speed;
  const kmh = (vpx / PX_PER_M) * 3.6;
  $('out-spd').textContent = kmh.toFixed(1) + ' km/h';
  const cadence = (vpx * 0.030) / TAU * 60;
  $('out-cad').textContent = Math.round(cadence) + ' rpm';
}

/* SECTION: controls */
const stage = $('stage');
const btnPlay = $('btn-play');
btnPlay.addEventListener('click', () => {
  state.playing = !state.playing;
  btnPlay.textContent = state.playing ? '暂停' : '继续';
  btnPlay.setAttribute('aria-pressed', String(state.playing));
  stage.classList.toggle('is-paused', !state.playing);
});

const spdEl = $('rng-speed'), outSpeed = $('out-speed');
function paintRange(){
  const pct = ((spdEl.value - spdEl.min) / (spdEl.max - spdEl.min)) * 100;
  spdEl.style.background = `linear-gradient(90deg, var(--ui-accent) ${pct}%, rgba(255,255,255,.2) ${pct}%)`;
}
spdEl.addEventListener('input', () => {
  state.speed = parseFloat(spdEl.value);
  outSpeed.textContent = state.speed.toFixed(2) + '×';
  paintRange();
  if (!state.playing){ render(); updateReadout(); }
});
paintRange();
if (reduced){ spdEl.value = String(state.speed); outSpeed.textContent = state.speed.toFixed(2) + '×'; paintRange(); }

const THEMES = [
  { key: 'day',   label: '白天', stars: 0, lamp: '#ffe08a' },
  { key: 'dusk',  label: '黄昏', stars: .25, lamp: '#fff1c9' },
  { key: 'night', label: '夜景', stars: 1, lamp: '#f3f6ff' }
];
let ti = 0;
const btnTheme = $('btn-theme');
btnTheme.addEventListener('click', () => {
  ti = (ti + 1) % THEMES.length;
  const t = THEMES[ti];
  document.body.dataset.theme = t.key;
  btnTheme.textContent = '切换场景 · ' + t.label;
  $('stars').setAttribute('opacity', t.stars);
  $('lamp').setAttribute('cy', t.key === 'night' ? 84 : 96);
});

// 空格键快捷控制
window.addEventListener('keydown', (e) => {
  if (e.code === 'Space' && e.target === document.body){ e.preventDefault(); btnPlay.click(); }
});

render();
updateReadout();
requestAnimationFrame(frame);
</script>
</body>
</html>
