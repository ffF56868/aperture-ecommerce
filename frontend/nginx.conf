server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Re-resolve the backend service after Docker recreates its container and IP address.
    resolver 127.0.0.11 ipv6=off valid=10s;
    set $backend_upstream backend:8000;

    location /api/ {
        proxy_pass http://$backend_upstream$request_uri;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://$backend_upstream$request_uri;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /static/ {
        proxy_pass http://$backend_upstream$request_uri;
        proxy_set_header Host $http_host;
    }

    location /media/ {
        proxy_pass http://$backend_upstream$request_uri;
        proxy_set_header Host $http_host;
    }

    # SPA fallback: let React Router handle unknown paths
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|svg|woff2?|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
