version: "3.9"

x-backend-env: &backend-env
  env_file:
    - ./backend/.env

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: ecommerce_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ecommerce}
      POSTGRES_USER: ${POSTGRES_USER:-ecommerce}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecommerce}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ecommerce}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ecommerce_network

  redis:
    image: redis:7-alpine
    container_name: ecommerce_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ecommerce_network

  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: ecommerce_etcd
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: 1000
      ETCD_QUOTA_BACKEND_BYTES: 4294967296
      ETCD_SNAPSHOT_COUNT: 50000
    command: >
      etcd
      --advertise-client-urls=http://etcd:2379
      --listen-client-urls=http://0.0.0.0:2379
      --data-dir=/etcd
    volumes:
      - milvus_etcd_data:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - ecommerce_network

  minio:
    image: minio/minio:latest
    container_name: ecommerce_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ecommerce_network

  milvus:
    image: milvusdb/milvus:v2.4.13
    container_name: ecommerce_milvus
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - milvus_data:/var/lib/milvus
    ports:
      # 9091/19530 are already used by another local Milvus stack.
      # Containers still use the internal ports and connect through the service name.
      - "19531:19530"
      - "9092:9091"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9091/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - ecommerce_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ecommerce_backend
    restart: unless-stopped
    <<: *backend-env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.local
      AFTER_SALES_VECTOR_BACKEND: ${AFTER_SALES_VECTOR_BACKEND:-milvus}
      MILVUS_URI: ${MILVUS_URI:-http://milvus:19530}
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 90 --reload"
    volumes:
      - ./backend:/app
      - ./docs:/project_docs
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      milvus:
        condition: service_healthy
    networks:
      - ecommerce_network

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ecommerce_celery_worker
    restart: unless-stopped
    <<: *backend-env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.local
      AFTER_SALES_VECTOR_BACKEND: ${AFTER_SALES_VECTOR_BACKEND:-milvus}
      MILVUS_URI: ${MILVUS_URI:-http://milvus:19530}
    command: celery -A config worker --loglevel=info
    volumes:
      - ./backend:/app
      - media_volume:/app/media
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      milvus:
        condition: service_healthy
    networks:
      - ecommerce_network

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ecommerce_celery_beat
    restart: unless-stopped
    <<: *backend-env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.local
      AFTER_SALES_VECTOR_BACKEND: ${AFTER_SALES_VECTOR_BACKEND:-milvus}
      MILVUS_URI: ${MILVUS_URI:-http://milvus:19530}
    command: celery -A config beat --loglevel=info
    volumes:
      - ./backend:/app
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      milvus:
        condition: service_healthy
    networks:
      - ecommerce_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ecommerce_frontend
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    ports:
      - "3000:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - ecommerce_network

networks:
  ecommerce_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
  milvus_etcd_data:
  milvus_data:
  static_volume:
  media_volume:

